<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #c41e3a;
            --dark-red: #8b1126;
            --black: #0a0a0a;
            --dark-gray: #1a1a1a;
            --light-gray: #f5f5f5;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--white);
            background-color: var(--black);
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(196, 30, 58, 0.3);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--primary-red);
        }

        /* Dropdown Menu */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--dark-gray);
            list-style: none;
            padding: 0.5rem 0;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            min-width: 150px;
        }

        .dropdown-menu li {
            padding: 0;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--white);
            text-decoration: none;
            transition: background 0.3s;
        }

        .dropdown-menu a:hover {
            background: var(--primary-red);
            color: var(--white);
        }

        .dropdown-menu a::after {
            display: none;
        }

        .dropdown:hover .dropdown-menu,
        .dropdown:focus-within .dropdown-menu {
            display: block;
        }

        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .mobile-menu span {
            width: 25px;
            height: 3px;
            background: var(--white);
            transition: 0.3s;
        }

        /* Page Header */
        .page-header {
            margin-top: 70px;
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--black) 100%);
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--light-gray);
        }

        /* Video Gallery Section */
        .video-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .video-grid {
            columns: 320px;
            column-gap: 1.5rem;
        }

        .video-item {
            background: var(--dark-gray);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }

        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.4);
        }

        .video-item video {
            width: 100%;
            height: auto;
            display: block;
            background: var(--black);
        }

        .video-item[hidden] {
            display: none;
        }

        .video-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 2rem 0;
            color: var(--light-gray);
        }

        .video-loader[hidden] {
            display: none;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--dark-gray);
            border-top-color: var(--primary-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        footer {
            background: var(--black);
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--dark-gray);
        }

        footer p {
            color: var(--light-gray);
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 0.75rem 1.25rem;
            }

            .logo {
                font-size: 1.15rem;
            }

            .logo img {
                height: 40px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                gap: 0;
                background: var(--black);
                border-top: 1px solid var(--dark-gray);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
                max-height: calc(100vh - 70px);
                overflow-y: auto;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links > li > a {
                display: block;
                padding: 1rem 1.5rem;
                border-bottom: 1px solid var(--dark-gray);
            }

            .nav-links a::after {
                display: none;
            }

            .dropdown-menu {
                display: block;
                position: static;
                box-shadow: none;
                padding: 0;
                background: var(--dark-gray);
            }

            .dropdown-menu a {
                padding: 0.9rem 2.5rem;
            }

            .mobile-menu {
                display: flex;
                padding: 0.5rem;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .video-grid {
                columns: 1;
            }
        }
    </style>
</head>

    <script>
        // Mobile menu toggle
        const mobileMenu = document.querySelector('.mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        
        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });

        navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

        // Reveal videos four at a time as the page is scrolled; posters load first so each box fills in quickly
        const BATCH = 4;
        const loader = document.getElementById('video-loader');
        const sentinel = document.getElementById('video-sentinel');
        let busy = false;

        function revealNext() {
            const next = [...document.querySelectorAll('.video-item[hidden]')].slice(0, BATCH);
            if (!next.length) {
                observer.disconnect();
                return;
            }
            busy = true;
            loader.hidden = false;
            Promise.all(next.map(item => new Promise(res => {
                const v = item.querySelector('video');
                const img = new Image();
                img.onload = img.onerror = res;
                img.src = v.dataset.poster;
            }))).then(() => {
                next.forEach(item => {
                    const v = item.querySelector('video');
                    v.poster = v.dataset.poster;
                    item.hidden = false;
                });
                loader.hidden = true;
                busy = false;
                if (document.querySelector('.video-item[hidden]')) {
                    // re-check in case the sentinel is still on screen
                    observer.unobserve(sentinel);
                    observer.observe(sentinel);
                } else {
                    observer.disconnect();
                }
            });
        }

        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && !busy) revealNext();
        }, { rootMargin: '300px' });
        observer.observe(sentinel);
    </script>
