<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos | Just Muay Thai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #c41e3a;
            --dark-red: #8b1126;
            --black: #0a0a0a;
            --dark-gray: #1a1a1a;
            --light-gray: #f5f5f5;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--white);
            background-color: var(--black);
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(196, 30, 58, 0.3);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--primary-red);
        }

        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .mobile-menu span {
            width: 25px;
            height: 3px;
            background: var(--white);
            transition: 0.3s;
        }

        /* Page Header */
        .page-header {
            margin-top: 70px;
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--black) 100%);
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--light-gray);
        }

        /* Gallery Section */
        .gallery-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: var(--dark-gray);
            cursor: pointer;
            transition: transform 0.3s;
            aspect-ratio: 1;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Footer */
        footer {
            background: var(--black);
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--dark-gray);
        }

        footer p {
            color: var(--light-gray);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu {
                display: flex;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <a href="../index.html" class="logo">
                <img src="../img/JMT Logo - white.jpg" alt="Just Muay Thai Logo">
                JUST MUAY THAI
            </a>
            <ul class="nav-links">
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#schedule">Schedule</a></li>
                <li><a href="../index.html#location">Location</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
                <li><a href="photos.html">Photos & Videos</a></li>
            </ul>
            <div class="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Page Header -->
    <div class="page-header">
        <h1>Training Photos</h1>
        <p>Capturing our journey in Muay Thai</p>
    </div>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="../Mark's Images/448805439_3709064259335908_1242477755175954166_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/448839892_861501359340819_2194316716809808028_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/448875302_887878096689874_1613644519983856269_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/448880829_2794476194058833_251346916521367593_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/448886076_1937047843402861_2867543737862413398_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/448897895_1907010496482708_2477240546350005333_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/449030469_353895824403182_6520717077143879301_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../Mark's Images/449505558_495955936431166_6173390467060965882_n.jpg" alt="Training photo">
            </div>
            <div class="gallery-item">
                <img src="../img/JMT - Mark Ramuee.jpg" alt="Mark Ramuee">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2012-2026 Just Muay Thai - Coventry & Nuneaton</p>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenu = document.querySelector('.mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        
        mobileMenu.addEventListener('click', () => {
            navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
        });
    </script>
</body>
</html>
